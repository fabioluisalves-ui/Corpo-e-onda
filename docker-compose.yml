services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: corpoonda
      POSTGRES_PASSWORD: corpoonda
      POSTGRES_DB: corpoonda
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpoonda"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: [.env]
    depends_on:
      db: { condition: service_healthy }
    ports: ["3333:3333"]
    command: sh -c "pnpm --filter @corpo-onda/api prisma:migrate && node apps/api/dist/main.js"

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    env_file: [.env]
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
