# Blueprint do Render — Corpo & Onda Estoque
# Provisiona: 1 banco PostgreSQL + serviço da API (NestJS) + serviço do site (Next.js).
# Uso: no Render → New → Blueprint → aponte para este repositório.

databases:
  - name: corpo-onda-db
    databaseName: corpoonda
    user: corpoonda
    plan: free # TROCAR por plano pago para produção (o free expira em 90 dias)

services:
  # ---------- API (NestJS + Prisma) ----------
  - type: web
    name: corpo-onda-api
    runtime: node
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/v1/health
    buildCommand: pnpm install --no-frozen-lockfile && cd apps/api && pnpm prisma:generate && pnpm build
    preDeployCommand: cd apps/api && pnpm prisma:migrate
    startCommand: cd apps/api && node dist/src/main.js
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: corpo-onda-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: TOKENS_ENCRYPTION_KEY
        sync: false
      - key: NUVEMSHOP_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        sync: false # colar a URL pública do site após o 1º deploy

  # ---------- Site (Next.js) ----------
  - type: web
    name: corpo-onda-web
    runtime: node
    plan: starter
    autoDeploy: true
    buildCommand: pnpm install --no-frozen-lockfile && cd apps/web && pnpm build
    startCommand: cd apps/web && pnpm start
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      - key: NEXT_PUBLIC_API_URL
        sync: false # colar a URL pública da API + "/api/v1" após o 1º deploy
